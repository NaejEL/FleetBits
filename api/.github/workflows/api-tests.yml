---
name: API Tests

# The full pytest suite of this repository, run where its cross-repository
# assertions can actually be evaluated: with FleetBits-agent, FleetBits-platform
# and FleetBits-ui checked out side by side, exactly as a developer's working
# root is laid out.
#
# This is the counterpart of security-regression-stack.yml, which runs
# `pytest -q -m security tests` INSIDE the fleet-api container image. That image
# contains /app and nothing else, so the tests marked `crossrepo` cannot run
# there — and they are, deliberately, not marked `security`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the sibling branch
        id: sibling
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # The device identity contract spans several repositories, and until
          # the monorepo merge lands a contract change lives on a branch of the
          # same name in each repository it touches. Check the sibling out from
          # that branch when it exists, and from its default branch otherwise —
          # an empty ref is what actions/checkout treats as "default branch".
          # Without this, a contract PR tests its own side against the OLD side
          # of every sibling and fails for a reason that is not a defect.
          for repo in FleetBits-agent FleetBits-platform FleetBits-ui; do
            url="https://github.com/${{ github.repository_owner }}/${repo}.git"
            if [ -n "${BRANCH}" ] \
               && git ls-remote --exit-code --heads "$url" "${BRANCH}" >/dev/null 2>&1; then
              echo "Sibling ${repo}: using ${BRANCH}"
              echo "${repo}=${BRANCH}" >> "$GITHUB_OUTPUT"
            else
              echo "Sibling ${repo}: using its default branch"
              echo "${repo}=" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Checkout FleetBits-api
        uses: actions/checkout@v4
        with:
          path: FleetBits-api

      - name: Checkout FleetBits-agent
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/FleetBits-agent
          ref: ${{ steps.sibling.outputs.FleetBits-agent }}
          path: FleetBits-agent

      - name: Checkout FleetBits-platform
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/FleetBits-platform
          ref: ${{ steps.sibling.outputs.FleetBits-platform }}
          path: FleetBits-platform

      - name: Checkout FleetBits-ui
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/FleetBits-ui
          ref: ${{ steps.sibling.outputs.FleetBits-ui }}
          path: FleetBits-ui

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create the virtualenv
        working-directory: FleetBits-api
        run: |
          python3 -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -r requirements.txt

      - name: Run the test suite
        working-directory: FleetBits-api
        run: ./.venv/bin/python -m pytest

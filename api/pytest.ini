[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    security: Security regression tests
    crossrepo: Tests that read the sibling folders of the monorepo (agent/, platform/, ui/).
        They are deliberately NOT marked `security`:
        the security suite runs inside the fleet-api container image, which holds
        /app alone. Run in full by `python -m pytest` and by .github/workflows/api-tests.yml.

[coverage:run]
omit =
    */site-packages/*
    */tests/*
    */test_*.py

---
name: Agent Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/agent-tests.yml'
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/agent-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck-and-bats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck and bats
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck bats

      - name: Run the agent test suite
        working-directory: agent
        run: ./scripts/run-tests.sh

---
name: Agent Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'agent/**'
      # Not just this file: a pull request that only touches workflows used to
      # run no test suite at all, so an actions/* bump was merged without ever
      # exercising the action. This suite is the cheapest real one in the
      # repository, and it uses actions/checkout, so it now guards that case.
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'agent/**'
      # Not just this file: a pull request that only touches workflows used to
      # run no test suite at all, so an actions/* bump was merged without ever
      # exercising the action. This suite is the cheapest real one in the
      # repository, and it uses actions/checkout, so it now guards that case.
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck-and-bats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck and bats
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck bats

      - name: Run the agent test suite
        working-directory: agent
        run: ./scripts/run-tests.sh

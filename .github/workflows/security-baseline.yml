name: Security Baseline

# Merged from the four security-baseline.yml files of the former repositories.
# The three cross-cutting jobs (dependency-review, secret-scan,
# filesystem-vuln-scan) were byte-identical in all four: they now cover the whole
# tree in a single pass. The two Python jobs stay separate because their bandit
# targets and their requirements.txt differ.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api-sast-and-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r api/requirements.txt
      - name: SAST scan (Bandit)
        run: bandit -r api/app -q -ll

  ui-sast-and-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r ui/requirements.txt
      - name: SAST scan (Bandit)
        run: bandit -r ui -x ./ui/static,./ui/templates -q -ll

  filesystem-vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Trivy filesystem scan
        run: trivy fs --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --format table .

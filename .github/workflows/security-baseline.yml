name: Security Baseline

# Fusion des quatre security-baseline.yml des anciens dépôts.
# Les trois jobs transverses (dependency-review, secret-scan, filesystem-vuln-scan)
# étaient strictement identiques dans les quatre : ils couvrent désormais tout
# l'arbre en une seule passe. Les deux jobs Python restent distincts parce que
# leurs cibles bandit et leurs requirements.txt diffèrent.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api-sast-and-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r api/requirements.txt
      - name: SAST scan (Bandit)
        run: bandit -r api/app -q -ll

  ui-sast-and-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r ui/requirements.txt
      - name: SAST scan (Bandit)
        run: bandit -r ui -x ./ui/static,./ui/templates -q -ll

  filesystem-vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Trivy filesystem scan
        run: trivy fs --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --format table .

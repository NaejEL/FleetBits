---
name: API Tests

# The full pytest suite of api/, including its cross-component assertions: the
# device identity contract is read from agent/ and platform/, which are now
# directories of this same repository.
#
# Counterpart to security-regression-stack.yml, which runs
# `pytest -q -m security tests` INSIDE the fleet-api container image. That image
# only contains /app, so tests marked `crossrepo` cannot run there — and they
# are deliberately not marked `security`.

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'agent/**'
      - 'platform/**'
      - 'ui/**'
      - '.github/workflows/api-tests.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'agent/**'
      - 'platform/**'
      - 'ui/**'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create the virtualenv
        working-directory: api
        run: |
          python3 -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -r requirements.txt

      - name: Run the test suite
        working-directory: api
        run: ./.venv/bin/python -m pytest

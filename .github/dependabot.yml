# One repository, four components with distinct ecosystems. Dependabot does not
# discover manifests on its own, so every directory is declared explicitly.
version: 2
updates:
  # Workflows live at the repository root, and only those ever run.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/ui"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/agent"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/platform"
    schedule:
      interval: "weekly"

---
name: Platform Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FleetBits-platform
        uses: actions/checkout@v4
        with:
          path: FleetBits-platform

      - name: Checkout FleetBits-agent
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/FleetBits-agent
          path: FleetBits-agent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Every tool installed here is invoked by scripts/run-tests.sh below:
      # ansible-playbook and ansible-lint for the syntax check and the two lint
      # passes, shellcheck for the shell ratchet over scripts/, docker/ and
      # dev-setup.sh. run-tests.sh prefers each of them from $PATH and falls
      # back to its container image, so installing them here is what keeps this
      # job from pulling three images on every run.
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint

      - name: Run the platform test suite
        working-directory: FleetBits-platform
        run: ./scripts/run-tests.sh

---
name: Platform Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the sibling branch
        id: sibling
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # The device identity contract spans several repositories, and until
          # the monorepo merge lands a contract change lives on a branch of the
          # same name in each repository it touches. Check the sibling out from
          # that branch when it exists, and from its default branch otherwise —
          # an empty ref is what actions/checkout treats as "default branch".
          # Without this, a contract PR tests its own side against the OLD side
          # of every sibling and fails for a reason that is not a defect.
          for repo in FleetBits-agent; do
            url="https://github.com/${{ github.repository_owner }}/${repo}.git"
            if [ -n "${BRANCH}" ] \
               && git ls-remote --exit-code --heads "$url" "${BRANCH}" >/dev/null 2>&1; then
              echo "Sibling ${repo}: using ${BRANCH}"
              echo "${repo}=${BRANCH}" >> "$GITHUB_OUTPUT"
            else
              echo "Sibling ${repo}: using its default branch"
              echo "${repo}=" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Checkout FleetBits-platform
        uses: actions/checkout@v4
        with:
          path: FleetBits-platform

      - name: Checkout FleetBits-agent
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/FleetBits-agent
          ref: ${{ steps.sibling.outputs.FleetBits-agent }}
          path: FleetBits-agent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Every tool installed here is invoked by scripts/run-tests.sh below:
      # ansible-playbook and ansible-lint for the syntax check and the two lint
      # passes. run-tests.sh prefers them from $PATH and falls back to its
      # container image, so installing them here keeps this job from pulling
      # images on every run.
      #
      # shellcheck is deliberately NOT installed: the shell step is a ratchet on
      # a finding COUNT, so it always runs the version pinned in run-tests.sh.
      # The distribution package is older and reports a different number, which
      # would fail the ratchet for a reason that is not a regression.
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint

      - name: Run the platform test suite
        working-directory: FleetBits-platform
        run: ./scripts/run-tests.sh

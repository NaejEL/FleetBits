# Mosquitto configuration for FleetBits control plane
# Listens on TCP 1883 (fleet_net internal only — not exposed to host).
#
# $SYS statistics are enabled for the mqtt-exporter sidecar.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type all

# ── Listeners ────────────────────────────────────────────────────────────────
# In Mosquitto 2.x the bind address must be on the same line as listener.
listener 1883 0.0.0.0
protocol mqtt

# ── Access control ───────────────────────────────────────────────────────────
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# ── Statistics — published to $SYS every 10s for the mqtt-exporter ───────────
sys_interval 10

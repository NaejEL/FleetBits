apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: "30s"
      httpMethod: POST

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: "device_id=(\\S+)"
          name: DeviceMetrics
          url: '/explore?left={"datasource":"prometheus","queries":[{"expr":"up{device_id=\"$${__value.raw}\"}"}],"range":{"from":"now-1h","to":"now"}}'

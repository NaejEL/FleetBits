# loki/loki.yml
# Minimal single-process Loki configuration for the FleetBits control plane.
# Logs are stored on the local filesystem inside the named Docker volume.
# Retention: 7 days default. Extend per stream via per-tenant override if needed.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://alertmanager:9093

# Retention: purge logs older than 7 days.
# For critical services (room-orchestrator, fleet-agent), increase via label-based override.
limits_config:
  retention_period: 168h   # 7 days
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_streams_per_user: 10000
  max_line_size: 256kb

compactor:
  working_directory: /loki/boltdb-shipper-compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

analytics:
  reporting_enabled: false

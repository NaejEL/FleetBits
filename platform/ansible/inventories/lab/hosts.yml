# Lab inventory
# ─────────────────────────────────────────────────────────────────────────────
# Purpose: development and testing against real hardware in the lab.
#          Devices have been enrolled into Headscale; use stable mesh IPs.
#
# Lab devices run in `ring: "0"` (CI) or `ring: "1"` (staging/lab).
# They are the target of GitHub Actions Ring 0 smoke tests.
#
# Usage:
#   ansible-playbook playbooks/site.yml -i inventories/lab/
#   ansible-playbook playbooks/deploy_artifact.yml -i inventories/lab/ \
#     -e "target_group=lab_rpi artifact_type=deb service_name=fleet-agent artifact_ref=1.2.3"
# ─────────────────────────────────────────────────────────────────────────────

all:
  vars:
    environment: lab
    fleet_metrics_url: "https://metrics.fleet.example.com/api/v1/write"
    fleet_logs_url:    "https://logs.fleet.example.com/loki/api/v1/push"
    fleet_api_url:     "https://api.fleet.example.com"

  children:
    lab:
      children:
        lab_rpi:
          vars:
            site:    lab
            zone:    zone-1
            ring:    "1"
            profile: profile_v1
          hosts:
            rpi-lab-zone1-01:
              device_role:  rpi-puzzle
              ansible_host: "100.64.99.11"
            rpi-lab-zone1-02:
              device_role:  rpi-video
              ansible_host: "100.64.99.12"

        lab_mini:
          vars:
            site:    lab
            zone:    ""
            ring:    "1"
          hosts:
            mini-lab-shared-01:
              device_role:  mini-shared
              shared_zones: ["zone-1"]
              ansible_host: "100.64.99.10"

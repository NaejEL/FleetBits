# Bootstrap inventory — temporary
# ─────────────────────────────────────────────────────────────────────────────
# Purpose: Day-0 enrollment of devices that already exist in the field
#          but have not yet joined the Headscale mesh.
#
# Fill in the current reachable IP (LAN, existing VPN, direct) for each device.
# Run `bootstrap_device.yml` once against this inventory, then:
#   - The playbook writes each device's Headscale IP back to inventories/prod/
#   - Destroy (or archive) this file — it is never used again.
#
# This inventory is intentionally NOT committed with real IPs.
# Populate it locally just before the bootstrap run.
#
# Usage:
#   ansible-playbook playbooks/bootstrap_device.yml \
#     -i inventories/bootstrap/ \
#     --forks 50
# ─────────────────────────────────────────────────────────────────────────────

all:
  children:
    bootstrap_targets:
      vars:
        # Temporary credentials for devices before they are on Headscale.
        # Remove this block once migration to Headscale IPs is done.
        ansible_user: pi
        ansible_ssh_private_key_file: ~/.ssh/id_fleet_bootstrap

      hosts:

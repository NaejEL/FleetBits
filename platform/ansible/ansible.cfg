[defaults]
vault_password_file = ~/.fleet-vault-pass
inventory           = inventories/

# Show diffs for changed files during playbook runs
diff_always = true

# Suppress per-task timing in favour of the callback summary
callbacks_enabled = profile_tasks

[ssh_connection]
# Accept new host keys automatically — devices join the fleet with known Headscale IPs,
# no pre-seeded known_hosts is needed. Review this for stricter environments.
ssh_args    = -o StrictHostKeyChecking=accept-new -o BatchMode=yes
pipelining  = true

# Run against up to 50 devices in parallel. Tune down for slow links.
forks = 50

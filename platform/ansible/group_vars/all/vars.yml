---
# group_vars/all/vars.yml
# ─────────────────────────────────────────────────────────────────────────────
# Fleet-wide defaults — inherited by every device.
# Site-specific overrides live in group_vars/site_<slug>/vars.yml.
# Per-device overrides live in host_vars/<hostname>.yml.
# Secrets live in group_vars/all/vault.yml (ansible-vault encrypted).
# ─────────────────────────────────────────────────────────────────────────────

# ── Connection ────────────────────────────────────────────────────────────────
ansible_user: fleet
ansible_python_interpreter: /usr/bin/python3

# ── Fleet control plane URLs ──────────────────────────────────────────────────
# Override per site if you run a secondary control plane.
fleet_metrics_url: "https://metrics.fleet.example.com/api/v1/write"
fleet_logs_url:    "https://logs.fleet.example.com/loki/api/v1/push"
fleet_api_url:     "https://api.fleet.example.com"
fleet_repo_url:    "https://repo.fleet.example.com"
headscale_url:     "https://headscale.fleet.example.com"

# ── aptly – private deb repo ──────────────────────────────────────────────────
aptly_gpg_key_id:    "PLACEHOLDER"                        # public key fingerprint
aptly_repo_suite:    "stable"
aptly_repo_component: "main"

# ── fleet-agent ───────────────────────────────────────────────────────────────
fleet_agent_service:   "fleet-agent"
fleet_agent_timer:     "fleet-heartbeat.timer"
fleet_identity_path:   "/etc/fleet/device-identity.conf"
# Keys of the device identity contract that carry a credential. Mirrors
# FLEET_IDENTITY_SECRET_KEYS in FleetBits-agent/usr/lib/fleet-agent/identity-lib.sh
# and SECRET_KEYS in FleetBits-api/app/contracts/device_identity.py.
fleet_identity_secret_keys:
  - FLEET_AGENT_TOKEN
  - REPO_BASIC_TOKEN
  - HEADSCALE_PREAUTH_KEY
  - MQTT_PASSWORD

# ── Device identity contract — values the Ansible producer writes ────────────
# Every name below is read by roles/fleet_agent/templates/device-identity.conf.j2.
# They are declared HERE, once, so the template can never fall back on a name
# that exists nowhere: a `| default('')` on an undefined variable renders an
# empty value silently, and an empty value is exactly what the agent-side
# consumers reject (or, worse, skip over) at run time.
#
# headscale_preauth_key — the reusable mesh pre-auth key. Same key the
#   headscale_enroll role passes to `tailscale up`; kept as one indirection so
#   the vault name stays the single secret and the template stays readable.
#   Empty is a declared, valid state: firstboot.sh then skips mesh enrollment.
headscale_preauth_key: "{{ vault_headscale_preauth_key | default('') }}"
#
# repo_basic_token — per-device APT credential. It is ISSUED BY THE FLEET API on
#   the provisioning path (firstboot.sh) and is deliberately NOT a vault secret
#   (see the "NOT here" note in vault.yml.example: per-device runtime tokens are
#   never stored in the vault). The automation path issues none, so it writes the
#   key with an empty value — the contract declares REPO_BASIC_TOKEN as allowed
#   to be empty. Override per host only if an operator minted one by hand.
repo_basic_token: ""
#
# mqtt_username / mqtt_password — the broker account the Alloy MQTT exporter
#   uses to scrape $SYS. Same shared `fleet_exporter` account the platform's own
#   mqtt-exporter container uses (docker/docker-compose.yml). Required and
#   asserted non-empty by roles/fleet_agent whenever enable_mqtt_exporter is
#   true, because generate-config.sh hard-fails without them.
mqtt_broker_host: "localhost"
mqtt_broker_port: 1883
mqtt_username: "fleet_exporter"
mqtt_password: "{{ vault_mqtt_broker_password | default('') }}"

# ── Alloy config ──────────────────────────────────────────────────────────────
alloy_config_path: "/etc/alloy/config.alloy"

# ── Observability defaults ────────────────────────────────────────────────────
scrape_interval:           "30s"
enable_mqtt_exporter:      false   # set true in host_vars if device runs Mosquitto
enable_process_exporter:   false   # set true in host_vars for mini-PCs

# ── Logging ───────────────────────────────────────────────────────────────────
log_level: "info"       # overridable per device in host_vars

# ── Deployment defaults ───────────────────────────────────────────────────────
artifact_package:  ""         # set by Semaphore extra-vars per job
artifact_version:  ""
artifact_service:  ""
artifact_type:     "deb"      # "deb" | "git"

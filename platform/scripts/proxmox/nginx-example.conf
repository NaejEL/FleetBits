#
# Manual deploy (if you skipped the prompt or are configuring a separate host):
#   curl -fsSL https://raw.githubusercontent.com/NaejEL/FleetBits-platform/main/scripts/proxmox/nginx-example.conf \
#     | sed "s/CT_IP/<lxc-ip>/g; s/fleet\.yourdomain\.com/<your-domain>/g" \
#     > /etc/nginx/sites-available/fleetbits
#   ln -s /etc/nginx/sites-available/fleetbits /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Prerequisites:
#   apt install nginx certbot python3-certbot-nginx
#
# Placeholders (auto-substituted by fleetbits.sh, or replace manually):
#   CT_IP           — the LXC container IP (shown at end of fleetbits.sh)
#   fleet.yourdomain.com — your actual Fleet base domain
#
# DNS:
#   Either create individual A records for each subdomain:
#     fleet.yourdomain.com          A  <proxmox-ip>
#     grafana.fleet.yourdomain.com  A  <proxmox-ip>
#     api.fleet.yourdomain.com      A  <proxmox-ip>
#     repo.fleet.yourdomain.com     A  <proxmox-ip>
#     headscale.fleet.yourdomain.com A  <proxmox-ip>
#     semaphore.fleet.yourdomain.com A  <proxmox-ip>
#     metrics.fleet.yourdomain.com  A  <proxmox-ip>
#     logs.fleet.yourdomain.com     A  <proxmox-ip>
#
#   Or a single wildcard (recommended):
#     *.fleet.yourdomain.com        A  <proxmox-ip>
#   + fleet.yourdomain.com          A  <proxmox-ip>
#
# TLS:
#   Run certbot to obtain Let's Encrypt certs:
#     certbot --nginx -d fleet.yourdomain.com \
#       -d grafana.fleet.yourdomain.com \
#       -d api.fleet.yourdomain.com \
#       -d repo.fleet.yourdomain.com \
#       -d headscale.fleet.yourdomain.com \
#       -d semaphore.fleet.yourdomain.com
#
#   For wildcard cert (requires DNS challenge):
#     certbot certonly --manual --preferred-challenges dns \
#       -d fleet.yourdomain.com -d *.fleet.yourdomain.com
# =============================================================================

# ── Upstream definition ────────────────────────────────────────────────────────
# Replace CT_IP with your LXC container's IP address (e.g. 192.168.1.42)
upstream fleetbits_caddy {
    server CT_IP:80;
    keepalive 64;
}

# ── HTTP → HTTPS redirect (certbot will manage TLS blocks below) ───────────────
server {
    listen 80;
    listen [::]:80;
    server_name fleet.yourdomain.com
                grafana.fleet.yourdomain.com
                api.fleet.yourdomain.com
                repo.fleet.yourdomain.com
                headscale.fleet.yourdomain.com
                semaphore.fleet.yourdomain.com
                metrics.fleet.yourdomain.com
                logs.fleet.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Fleet UI ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fleet.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/fleet.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fleet.yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://fleetbits_caddy;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 300s;
    }
}


# =============================================================================
# nginx reverse proxy config for FleetBits
# =============================================================================
# This file is used by ct/fleetbits.sh automatically when you answer "y" to
# the nginx setup prompt. The installer substitutes the two placeholders below
# and deploys the result to /etc/nginx/sites-available/fleetbits for you.
#
# Manual deploy (if you skipped the prompt or are configuring a separate host):
#   curl -fsSL https://raw.githubusercontent.com/NaejEL/FleetBits-platform/main/scripts/proxmox/nginx-example.conf \
#     | sed "s/CT_IP/<lxc-ip>/g; s/fleet\.yourdomain\.com/<your-domain>/g" \
#     > /etc/nginx/sites-available/fleetbits
#   ln -s /etc/nginx/sites-available/fleetbits /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   # Then run certbot to obtain TLS certificates:
#   certbot --nginx -d <your-domain> -d grafana.<your-domain> -d api.<your-domain> \
#     -d repo.<your-domain> -d headscale.<your-domain> -d semaphore.<your-domain> \
#     -d metrics.<your-domain> -d logs.<your-domain>
#
# Prerequisites:
#   apt install nginx certbot python3-certbot-nginx
#
# Placeholders (auto-substituted by fleetbits.sh, or replace manually):
#   CT_IP                — the LXC container IP (shown at end of fleetbits.sh)
#   fleet.yourdomain.com — your actual Fleet base domain
#
# How TLS works here:
#   This file contains HTTP-only server blocks. Run certbot --nginx after
#   deploying it — certbot will obtain Let's Encrypt certificates and
#   automatically add TLS server blocks + HTTP→HTTPS redirects to this config.
#   This avoids the chicken-and-egg problem of referencing certs that don't
#   exist yet (which would cause nginx -t to fail before certbot runs).
#
# DNS:
#   Either create individual A records for each subdomain:
#     fleet.yourdomain.com          A  <proxmox-ip>
#     grafana.fleet.yourdomain.com  A  <proxmox-ip>
#     api.fleet.yourdomain.com      A  <proxmox-ip>
#     repo.fleet.yourdomain.com     A  <proxmox-ip>
#     headscale.fleet.yourdomain.com A  <proxmox-ip>
#     semaphore.fleet.yourdomain.com A  <proxmox-ip>
#     metrics.fleet.yourdomain.com  A  <proxmox-ip>
#     logs.fleet.yourdomain.com     A  <proxmox-ip>
#
#   Or a single wildcard (recommended):
#     *.fleet.yourdomain.com        A  <proxmox-ip>
#   + fleet.yourdomain.com          A  <proxmox-ip>
# =============================================================================

# ── Upstream definition ────────────────────────────────────────────────────────
# Replace CT_IP with your LXC container's IP address (e.g. 192.168.1.42)
upstream fleetbits_caddy {
    server CT_IP:80;
    keepalive 64;
}

# ── Fleet UI ───────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name fleet.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        proxy_pass         http://fleetbits_caddy;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# ── Grafana ────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name grafana.fleet.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        proxy_pass         http://fleetbits_caddy;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}

# ── Fleet API ──────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.fleet.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        proxy_pass         http://fleetbits_caddy;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        client_max_body_size 10M;
    }
}

# ── Aptly .deb repository ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name repo.fleet.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        proxy_pass         http://fleetbits_caddy;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Aptly uploads can be large .deb files
        client_max_body_size 500M;
        proxy_read_timeout 300s;
    }
}

# ── Headscale ──────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name headscale.fleet.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        proxy_pass         http://fleetbits_caddy;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}

# ── Semaphore (Ansible runner) ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name semaphore.fleet.yourdomain.com;

    # Uncomment to restrict to VPN / private network only:
    # allow 100.64.0.0/10;   # Tailscale / Headscale
    # allow 10.0.0.0/8;      # Private network
    # allow 192.168.0.0/16;
    # deny all;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        proxy_pass         http://fleetbits_caddy;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}

# ── Prometheus (metrics) — restrict write to internal only ────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name metrics.fleet.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    # Allow devices on your Headscale mesh and RFC1918 ranges; deny everything else
    location /api/v1/write {
        allow 100.64.0.0/10;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass         http://fleetbits_caddy;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location / {
        return 403;
    }
}

# ── Loki (log ingestion) — restrict push to internal only ────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name logs.fleet.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location /loki/api/v1/push {
        allow 100.64.0.0/10;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass         http://fleetbits_caddy;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }
    location / {
        return 403;
    }
}

